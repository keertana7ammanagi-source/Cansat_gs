[platformio]
src_dir = firmware

[env:ttgo-lora32-v1]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<ground_receiver/src/main.cpp>
lib_deps =
    sandeepmistry/LoRa
    madhephaestus/ESP32Servo

[env:ttgo-lora32-v1-flight]
extends = env:ttgo-lora32-v1
build_src_filter = +<flight_transmitter/src/main.cpp>